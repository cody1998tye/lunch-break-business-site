<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A17"/>
      <stop offset="100%" stop-color="#2A2720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Amber accent bar left -->
  <rect x="80" y="80" width="4" height="470" fill="#D89A2B" opacity="0.9"/>

  <!-- Eyebrow -->
  <text x="108" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill="#D89A2B" font-weight="400" text-rendering="optimizeLegibility">LUNCH BREAK BUSINESS</text>

  <!-- Main headline — line 1 -->
  <text x="108" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#F4EDE1" font-weight="700" text-rendering="optimizeLegibility">Build your first</text>

  <!-- Main headline — line 2 -->
  <text x="108" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#F4EDE1" font-weight="700" text-rendering="optimizeLegibility">online offer</text>

  <!-- Highlighted phrase -->
  <rect x="100" y="362" width="740" height="80" fill="#D89A2B" rx="4"/>
  <text x="116" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#1C1A17" font-weight="700" text-rendering="optimizeLegibility">in the margins.</text>

  <!-- Subline -->
  <text x="108" y="532" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F4EDE1" opacity="0.65" text-rendering="optimizeLegibility">30–60 minutes a day · No quitting your job · @realcodytye</text>

</svg>
