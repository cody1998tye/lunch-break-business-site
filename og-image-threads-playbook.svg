<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1A17"/>
      <stop offset="100%" stop-color="#2A2720"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Amber accent bar left -->
  <rect x="80" y="80" width="4" height="470" fill="#D89A2B" opacity="0.9"/>

  <!-- Eyebrow -->
  <text x="108" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill="#D89A2B" font-weight="400" text-rendering="optimizeLegibility">LUNCH BREAK BUSINESS · THE THREADS PLAYBOOK</text>

  <!-- Main headline — line 1 -->
  <text x="108" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F4EDE1" font-weight="700" text-rendering="optimizeLegibility">30 days from now,</text>

  <!-- Main headline — line 2 -->
  <text x="108" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F4EDE1" font-weight="700" text-rendering="optimizeLegibility">you'll know exactly</text>

  <!-- Highlighted phrase -->
  <rect x="100" y="352" width="970" height="78" fill="#D89A2B" rx="4"/>
  <text x="116" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#1C1A17" font-weight="700" text-rendering="optimizeLegibility">what works on Threads.</text>

  <!-- Subline -->
  <text x="108" y="532" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#F4EDE1" opacity="0.65" text-rendering="optimizeLegibility">30 min/day · 30 posts · Built by a working dad of four · @realcodytye</text>

</svg>
